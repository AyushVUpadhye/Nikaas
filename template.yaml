AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Nikaas - evacuation planner API (Lambda + HTTP API) and web hosting (S3)

Globals:
  Function:
    Timeout: 29 # HTTP API gives up after 30 s
    MemorySize: 2048 # >= 1769 MB = one full vCPU; /optimise on lab_block takes ~8 s on a laptop core
    Runtime: python3.11
    Architectures: [x86_64]
  HttpApi:
    # public API with no login: cap traffic so nobody can burn the AWS credits (every /vision call costs Bedrock)
    DefaultRouteSettings:
      ThrottlingRateLimit: 10 # requests per second, steady
      ThrottlingBurstLimit: 20
    RouteSettings:
      "GET /drill": # every judge's phone polls this during Live Drill (cheap: one small S3 read)
        ThrottlingRateLimit: 30
        ThrottlingBurstLimit: 60

Resources:
  # FastAPI app (nikaas/api.py) wrapped by Mangum. Every path and method goes to it.
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: build/lambda/ # staged by scripts/build_lambda.py (nikaas/ + runtime requirements only)
      Handler: nikaas.api.handler
      Environment:
        Variables:
          # Bedrock is called in us-east-1 until ap-south-1 access is verified
          BEDROCK_REGION: us-east-1
          PHOTO_BUCKET: !Ref PhotoBucket
          # Live Drill state (drill/state.json) is shared by all Lambda instances through S3 (nikaas/drill.py)
          NIKAAS_DRILL_BUCKET: !Ref PhotoBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel] # also covers the Converse API
              Resource: "*"
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub "${PhotoBucket.Arn}/drill/*"
            - Effect: Allow # lets a missing drill/state.json read as NoSuchKey ("no drill running"), not AccessDenied
              Action: s3:ListBucket
              Resource: !GetAtt PhotoBucket.Arn
        - S3WritePolicy:
            BucketName: !Ref PhotoBucket
      Events:
        Api:
          Type: HttpApi # no Path = catch-all $default route; FastAPI does routing and CORS
        DrillPoll:
          Type: HttpApi # own route only so it can have a higher rate limit (RouteSettings above)
          Properties:
            Path: /drill
            Method: GET

  # Floor-plan photos sent to POST /vision and what vision made of them (photos/, results/). Private.
  PhotoBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-uploads
            Status: Enabled
            ExpirationInDays: 30

  # Static web build (Vite `dist/`). Upload with:
  #   aws s3 sync web/dist s3://<WebBucketName> --delete
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html # single-page app: unknown paths load the app
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"

Outputs:
  ApiUrl:
    Description: Public API URL (try /health)
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  WebUrl:
    Description: Public website URL
    Value: !GetAtt WebBucket.WebsiteURL
  WebBucketName:
    Description: Bucket to upload the web build to
    Value: !Ref WebBucket
  PhotoBucketName:
    Description: Private bucket with /vision uploads and results
    Value: !Ref PhotoBucket
